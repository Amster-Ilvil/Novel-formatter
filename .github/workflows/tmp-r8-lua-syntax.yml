name: tmp-r8-lua-syntax
on:
  push:
    branches:
      - tmp/native-koreader-kfx-20260907
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua syntax validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 luajit
      - name: Validate R8 modified Lua
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/r8-lua-result.txt) 2>&1
          rm -rf /tmp/r8lua && mkdir -p /tmp/r8lua
          tar -xzf .tmp/r8-lua-test.tar.gz -C /tmp/r8lua || exit 90
          mapfile -t files < <(find /tmp/r8lua -type f -name '*.lua' | sort)
          echo "Lua files: ${#files[@]}"
          command -v luac5.1 || true
          command -v luac || true
          command -v lua5.1 || true
          command -v luajit || true
          rc=0
          LUAC=$(command -v luac5.1 || command -v luac || true)
          for f in "${files[@]}"; do
            echo "===== $f"
            "$LUAC" -p "$f"; r=$?; echo "luac_rc=$r"; [ $r -eq 0 ] || rc=1
            luajit -b "$f" /tmp/out.luac; r=$?; echo "luajit_rc=$r"; [ $r -eq 0 ] || rc=1
            rm -f /tmp/out.luac
          done
          grep -R 'pcall(self.progress_callback' /tmp/r8lua && { echo BAD_PCALL; rc=1; } || true
          grep -R 'Trapper:info()' /tmp/r8lua/plugins/kindle.koplugin || true
          echo "FINAL_RC=$rc"
          exit $rc
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-lua-syntax-result
          path: /tmp/r8-lua-result.txt
          if-no-files-found: error
          compression-level: 0
      - name: Fail if validation failed
        if: steps.validate.outcome != 'success'
        run: exit 1
