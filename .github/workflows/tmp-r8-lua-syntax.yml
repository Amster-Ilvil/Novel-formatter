name: tmp-r8-lua-syntax
on:
  push:
    branches:
      - tmp/native-koreader-kfx-20260907
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua syntax validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 luajit
      - name: Validate R8 modified Lua
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r8lua && mkdir -p /tmp/r8lua
          tar -xzf .tmp/r8-lua-test.tar.gz -C /tmp/r8lua
          mapfile -t files < <(find /tmp/r8lua -type f -name '*.lua' | sort)
          printf 'Lua files: %s\n' "${#files[@]}"
          test "${#files[@]}" -eq 7
          for f in "${files[@]}"; do
            echo "lua5.1: $f"
            luac5.1 -p "$f"
            echo "luajit: $f"
            luajit -b "$f" /tmp/out.luac
            rm -f /tmp/out.luac
          done
          ! grep -R 'pcall(self.progress_callback' /tmp/r8lua
          grep -R 'Trapper:info()' /tmp/r8lua/plugins/kindle.koplugin | head
          echo 'R8 Lua syntax PASS'
