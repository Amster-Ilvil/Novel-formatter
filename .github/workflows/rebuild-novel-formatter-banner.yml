name: Rebuild Novel Formatter banner

on:
  push:
    paths:
      - ".github/workflows/rebuild-novel-formatter-banner.yml"

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact high-resolution banner
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/banner_parts/part01.b64 \
            .github/banner_parts/part02.b64 \
            .github/banner_parts/part03.b64 \
            .github/banner_parts/part04.b64 \
            .github/banner_parts/part05.b64 \
            .github/banner_parts/part06.b64 \
            .github/banner_parts/part07.b64 \
            .github/banner_parts/part08.b64 \
            | tr -d '\r\n' | base64 -d > assets/novel_formatter_banner.webp

          test "$(wc -c < assets/novel_formatter_banner.webp | tr -d ' ')" = "88080"
          actual_sha="$(sha256sum assets/novel_formatter_banner.webp | awk '{print $1}')"
          test "$actual_sha" = "222f3431c1020005e23a87ef62f03296dcd7404853f9231f7225ca970723e2f6"

          sed -i 's#assets/novel_formatter_banner\.svg#assets/novel_formatter_banner.webp#g' README.md
          sed -i 's#assets/novel_formatter_banner\.jpg#assets/novel_formatter_banner.webp#g' README.md
          sed -i 's#assets/novel_formatter_banner\.png#assets/novel_formatter_banner.webp#g' README.md

          rm -f assets/novel_formatter_banner.svg assets/novel_formatter_banner.jpg assets/novel_formatter_banner.png
          rm -rf .github/banner_parts
          rm -f .github/workflows/rebuild-novel-formatter-banner.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use uploaded Novel Formatter banner in README"
          git push
