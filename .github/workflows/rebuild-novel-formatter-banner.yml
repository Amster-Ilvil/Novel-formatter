name: Rebuild Novel Formatter banner

on:
  push:
    paths:
      - ".github/workflows/rebuild-novel-formatter-banner.yml"

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact high-resolution banner
        shell: bash
        run: |
          set -euo pipefail

          prefix="$(cat \
            .github/banner_parts/part01.b64 \
            .github/banner_parts/part02.b64 \
            .github/banner_parts/part03.b64 \
            .github/banner_parts/part04.b64 \
            .github/banner_parts/part05.b64 \
            .github/banner_parts/part06.b64 \
            .github/banner_parts/part07.b64 \
            | tr -d '\r\n')"
          suffix="$(tr -d '\r\n' < .github/banner_parts/part08.b64)"

          expected_sha="222fb09d806447e4ed6d9d1b74b13f5f901370600a45744963063a62d3a5e7a4"
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          found=0
          for ((i=0; i<${#alphabet}; i++)); do
            c="${alphabet:i:1}"
            if printf '%s%s%s' "$prefix" "$c" "$suffix" | base64 -d > /tmp/banner.webp 2>/dev/null; then
              size="$(wc -c < /tmp/banner.webp | tr -d ' ')"
              sha="$(sha256sum /tmp/banner.webp | awk '{print $1}')"
              if [[ "$size" == "88080" && "$sha" == "$expected_sha" ]]; then
                mv /tmp/banner.webp assets/novel_formatter_banner.webp
                found=1
                break
              fi
            fi
          done
          test "$found" = "1"

          sed -i 's#assets/novel_formatter_banner\.svg#assets/novel_formatter_banner.webp#g' README.md
          sed -i 's#assets/novel_formatter_banner\.jpg#assets/novel_formatter_banner.webp#g' README.md
          sed -i 's#assets/novel_formatter_banner\.png#assets/novel_formatter_banner.webp#g' README.md

          rm -f assets/novel_formatter_banner.svg assets/novel_formatter_banner.jpg assets/novel_formatter_banner.png
          rm -rf .github/banner_parts
          rm -f .github/workflows/rebuild-novel-formatter-banner.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use exact high-resolution Novel Formatter banner"
          git push
