name: Build and publish Novel Formatter releases

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel-formatter-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    name: Privacy audit and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Privacy audit
        run: python scripts/privacy_audit.py
      - name: Release supply-chain and Keychain regression
        run: python -m unittest discover -s tests -p test_release_security_v22.py -v
      - id: meta
        name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid release VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Novel Formatter release: $VERSION"

  windows:
    name: Windows x64 installer + portable
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Privacy audit
        run: python scripts/privacy_audit.py
      - name: Compile public bootstrap
        run: python -m py_compile bootstrap.py scripts/privacy_audit.py
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $candidate = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if ($candidate) {
            Write-Host "Using $candidate"
            exit 0
          }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Inno Setup 6.' }
      - name: Build Windows installer and portable package
        shell: pwsh
        run: ./packaging/build_windows_release.ps1 -Version $env:VERSION -RequireInstaller
      - name: Verify Windows assets
        shell: pwsh
        run: |
          $setup = "dist/NovelFormatter_${env:VERSION}_Windows_x64_Setup.exe"
          $zip = "dist/NovelFormatter_${env:VERSION}_Windows_x64.zip"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Missing $setup" }
          if (-not (Test-Path -LiteralPath $zip)) { throw "Missing $zip" }
          if ((Get-Item -LiteralPath $setup).Length -lt 100KB) { throw 'Installer is unexpectedly small.' }
          if ((Get-Item -LiteralPath $zip).Length -lt 100KB) { throw 'Portable ZIP is unexpectedly small.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NovelFormatter-Windows-x64
          path: |
            dist/NovelFormatter_${{ env.VERSION }}_Windows_x64_Setup.exe
            dist/NovelFormatter_${{ env.VERSION }}_Windows_x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos:
    name: macOS ${{ matrix.label }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: AppleSilicon
            arch: arm64
          - os: macos-15-intel
            label: Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      LABEL: ${{ matrix.label }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Confirm runner architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "macOS: $(sw_vers -productVersion)"
          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Privacy audit
        run: python scripts/privacy_audit.py
      - name: Compile public bootstrap
        run: python -m py_compile bootstrap.py scripts/privacy_audit.py
      - name: Build app, sign and verify DMG
        shell: bash
        run: bash packaging/build_macos_dmg.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NovelFormatter-macOS-${{ matrix.label }}
          path: |
            package/NovelFormatter_${{ env.VERSION }}_macOS_${{ matrix.label }}.dmg
            package/NovelFormatter_${{ env.VERSION }}_macOS_${{ matrix.label }}.app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  linux:
    name: Linux ${{ matrix.label }} AppImage + DEB + portable
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: x86_64
            arch: x86_64
          - os: ubuntu-24.04-arm
            label: ARM64
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      LABEL: ${{ matrix.label }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Confirm Linux runner architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "Linux: $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          command -v dpkg-deb
          command -v curl
      - name: Install Linux packaging helpers
        shell: bash
        run: python -m pip install --disable-pip-version-check "uv>=0.8,<1" "Pillow>=10,<13"
      - name: Privacy audit
        run: python scripts/privacy_audit.py
      - name: Compile public bootstrap and launcher checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile bootstrap.py scripts/privacy_audit.py
          bash -n packaging/launcher_linux.sh packaging/build_linux_release.sh
      - name: Build Linux packages
        shell: bash
        run: bash packaging/build_linux_release.sh
      - name: Verify Linux package structure
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="dist/NovelFormatter_${VERSION}_Linux_${LABEL}.AppImage"
          DEB="dist/NovelFormatter_${VERSION}_Linux_${LABEL}.deb"
          TARBALL="dist/NovelFormatter_${VERSION}_Linux_${LABEL}.tar.gz"
          test -x "$APPIMAGE"
          test -s "$DEB"
          test -s "$TARBALL"
          test "$(stat -c '%s' "$APPIMAGE")" -gt 100000
          test "$(stat -c '%s' "$DEB")" -gt 100000
          test "$(stat -c '%s' "$TARBALL")" -gt 100000
          dpkg-deb --info "$DEB" >/dev/null
          TAR_LIST="$RUNNER_TEMP/novel-formatter-${LABEL}-tar-list.txt"
          tar -tzf "$TARBALL" > "$TAR_LIST"
          grep -q '/bin/novel-formatter$' "$TAR_LIST"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-version >/dev/null 2>&1 || true
      - name: First-run Linux AppImage smoke test
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$GITHUB_WORKSPACE/dist/NovelFormatter_${VERSION}_Linux_${LABEL}.AppImage"
          TEST_HOME="$RUNNER_TEMP/novel-formatter-linux-home"
          mkdir -p "$TEST_HOME/data" "$TEST_HOME/cache" "$TEST_HOME/state"
          export HOME="$TEST_HOME"
          export XDG_DATA_HOME="$TEST_HOME/data"
          export XDG_CACHE_HOME="$TEST_HOME/cache"
          export XDG_STATE_HOME="$TEST_HOME/state"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export NF_PREPARE_ONLY=1
          export QT_QPA_PLATFORM=offscreen
          "$APPIMAGE"
          "$APPIMAGE"
          cat "$XDG_STATE_HOME/NovelFormatter/logs/launcher.log"
          grep -q 'LINUX_PREPARE_OK' "$XDG_STATE_HOME/NovelFormatter/logs/launcher.log"
          grep -q 'BOOT_STAGE=main_dependencies_ready' "$XDG_STATE_HOME/NovelFormatter/logs/launcher.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NovelFormatter-Linux-${{ matrix.label }}
          path: |
            dist/NovelFormatter_${{ env.VERSION }}_Linux_${{ matrix.label }}.AppImage
            dist/NovelFormatter_${{ env.VERSION }}_Linux_${{ matrix.label }}.deb
            dist/NovelFormatter_${{ env.VERSION }}_Linux_${{ matrix.label }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [metadata, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "downloaded/NovelFormatter-Windows-x64/NovelFormatter_${VERSION}_Windows_x64_Setup.exe" release-assets/
          cp "downloaded/NovelFormatter-Windows-x64/NovelFormatter_${VERSION}_Windows_x64.zip" release-assets/
          cp "downloaded/NovelFormatter-macOS-AppleSilicon/NovelFormatter_${VERSION}_macOS_AppleSilicon.dmg" release-assets/
          cp "downloaded/NovelFormatter-macOS-AppleSilicon/NovelFormatter_${VERSION}_macOS_AppleSilicon.app.zip" release-assets/
          cp "downloaded/NovelFormatter-macOS-Intel/NovelFormatter_${VERSION}_macOS_Intel.dmg" release-assets/
          cp "downloaded/NovelFormatter-macOS-Intel/NovelFormatter_${VERSION}_macOS_Intel.app.zip" release-assets/
          cp "downloaded/NovelFormatter-Linux-x86_64/NovelFormatter_${VERSION}_Linux_x86_64.AppImage" release-assets/
          cp "downloaded/NovelFormatter-Linux-x86_64/NovelFormatter_${VERSION}_Linux_x86_64.deb" release-assets/
          cp "downloaded/NovelFormatter-Linux-x86_64/NovelFormatter_${VERSION}_Linux_x86_64.tar.gz" release-assets/
          cp "downloaded/NovelFormatter-Linux-ARM64/NovelFormatter_${VERSION}_Linux_ARM64.AppImage" release-assets/
          cp "downloaded/NovelFormatter-Linux-ARM64/NovelFormatter_${VERSION}_Linux_ARM64.deb" release-assets/
          cp "downloaded/NovelFormatter-Linux-ARM64/NovelFormatter_${VERSION}_Linux_ARM64.tar.gz" release-assets/

          cat > release-assets/BUILD-INFO.txt <<EOF
          Novel Formatter Studio ${VERSION}
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Build source: clean GitHub Actions checkout (tracked files only)
          Privacy audit: PASS
          Windows x64 user-level EXE installer: PASS
          Windows x64 portable ZIP: PASS
          macOS Apple Silicon arm64 DMG: PASS
          macOS Intel x86_64 DMG: PASS
          macOS ad-hoc codesign: PASS
          macOS hdiutil verification: PASS
          Linux x86_64 AppImage / DEB / portable tar.gz: PASS
          Linux ARM64 AppImage / DEB / portable tar.gz: PASS
          Linux native first-run AppImage smoke tests: PASS
          OCR model weights bundled: no
          OCR runtimes / virtual environments bundled: no
          .env / API keys / logs / user documents bundled: no
          EOF

          cd release-assets
          sha256sum \
            "NovelFormatter_${VERSION}_Windows_x64_Setup.exe" \
            "NovelFormatter_${VERSION}_Windows_x64.zip" \
            "NovelFormatter_${VERSION}_macOS_AppleSilicon.dmg" \
            "NovelFormatter_${VERSION}_macOS_AppleSilicon.app.zip" \
            "NovelFormatter_${VERSION}_macOS_Intel.dmg" \
            "NovelFormatter_${VERSION}_macOS_Intel.app.zip" \
            "NovelFormatter_${VERSION}_Linux_x86_64.AppImage" \
            "NovelFormatter_${VERSION}_Linux_x86_64.deb" \
            "NovelFormatter_${VERSION}_Linux_x86_64.tar.gz" \
            "NovelFormatter_${VERSION}_Linux_ARM64.AppImage" \
            "NovelFormatter_${VERSION}_Linux_ARM64.deb" \
            "NovelFormatter_${VERSION}_Linux_ARM64.tar.gz" \
            > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          ## Novel Formatter Studio ${VERSION}

          本 Release 直接由当前 main 提交 **${GITHUB_SHA}** 在 GitHub Actions 干净环境中构建。

          ### v2.2 更新（相对 v2.1）
          - **macOS 凭据安全**：通过系统 Security.framework Keychain API 保存、更新和删除 AI/OCR 密钥，避免把密钥放进 `security` 命令的进程参数。
          - **Python 下载校验**：Mac/Windows 可从镜像下载运行时，但 SHA256SUMS 只能从官方 astral-sh GitHub Release 获取；无法取到官方校验文件时拒绝安装。
          - **Linux 构建链加固**：AppImageKit 构建工具绑定固定的官方 GitHub 资产 ID、大小和更新时间，下载前后核验；检测到更换即拒绝执行。上游未提供独立 SHA-256，资产身份锁定不等于文件哈希签名校验。
          - **CI 审计**：GitHub Actions 使用固定提交 SHA，发布前执行 Keychain/下载来源安全回归与隐私审计。
          - **OCR 运行改进**：Hayai 优先复用既有环境并统一 GUI/Worker 选择，离线拒绝重复安装；Hayai、48px、NDLOCR 增加可选的独立 Worker 缓存。
          - **导入及 EPUB**：支持 CBZ/ZIP 漫画、WebP 和基于文件签名的图片导入；补齐 OCR WebP 参考预览，增加可选 LTR 横排 EPUB。
          - **质量与兼容性**：增强 Pillow 备用分栏、OpenVINO 模型哈希检查、Ruby 离线保护和自绘侧边栏的语言切换。

          ### 安全及验证说明
          - 发布包不内置任何 OCR 权重或用户数据。首次运行可能下载安装独立 Python 和主程序依赖；请勿在不信任网络中使用自动安装。
          - 模型上游、镜像、在线 AI 服务和未经独立校验的第三方依赖仍属于供应链与隐私边界；本版本不宣称不存在所有潜在后门。
          - 多平台打包与 Linux 首次启动由 GitHub Actions 验证；不代表三种 OCR 已在所有 Mac/Windows/Linux 硬件完成端到端准确率验收。

          ### 推荐下载
          - **Windows x64（推荐）**：**NovelFormatter_${VERSION}_Windows_x64_Setup.exe** —— 双击安装，无需管理员权限；安装后从开始菜单启动。
          - **Windows x64 便携版**：**NovelFormatter_${VERSION}_Windows_x64.zip** —— 解压后双击“启动Windows.bat”。
          - **Mac Apple Silicon / M 系列（推荐）**：**NovelFormatter_${VERSION}_macOS_AppleSilicon.dmg**。
          - **Mac Intel（推荐）**：**NovelFormatter_${VERSION}_macOS_Intel.dmg**。
          - **Linux x86_64（推荐）**：**NovelFormatter_${VERSION}_Linux_x86_64.AppImage** —— 赋予执行权限后直接运行，无需管理员权限。
          - **Linux ARM64（推荐）**：**NovelFormatter_${VERSION}_Linux_ARM64.AppImage** —— 原生 ARM64 构建。
          - Linux 同时提供 .deb（Debian/Ubuntu 系）和 .tar.gz（通用便携版）。
          - macOS .app.zip 保留为不使用 DMG 时的备用包。

          Windows、macOS 与 Linux 首次启动都会自动准备主程序运行环境；Linux AppImage/便携版使用包内 uv 在用户目录准备 Python 3.12 与主 GUI 依赖。OCR 模型与 OCR 专用运行环境仍按需安装，只在用户实际启动对应 OCR 并确认后下载。

          Apple Live Text / Apple Vision 与 MLX 属于 macOS 专属能力；Linux 使用可跨平台的 OCR 后端。Linux x86_64 与 ARM64 均在对应原生 GitHub runner 上完成首次启动依赖准备和 GUI 导入烟雾测试。

          发布包只来自 Git 跟踪文件，不包含开发机缓存、.env、API Key、模型缓存、日志、用户小说、OCR 结果、EPUB 或 DOCX。请使用 SHA256SUMS.txt 校验下载文件。
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Novel Formatter Studio ${VERSION}" --notes-file "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Novel Formatter Studio ${VERSION}" --notes-file "$NOTES" --latest
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Verify published assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for name in \
            "NovelFormatter_${VERSION}_Windows_x64_Setup.exe" \
            "NovelFormatter_${VERSION}_Windows_x64.zip" \
            "NovelFormatter_${VERSION}_macOS_AppleSilicon.dmg" \
            "NovelFormatter_${VERSION}_macOS_AppleSilicon.app.zip" \
            "NovelFormatter_${VERSION}_macOS_Intel.dmg" \
            "NovelFormatter_${VERSION}_macOS_Intel.app.zip" \
            "NovelFormatter_${VERSION}_Linux_x86_64.AppImage" \
            "NovelFormatter_${VERSION}_Linux_x86_64.deb" \
            "NovelFormatter_${VERSION}_Linux_x86_64.tar.gz" \
            "NovelFormatter_${VERSION}_Linux_ARM64.AppImage" \
            "NovelFormatter_${VERSION}_Linux_ARM64.deb" \
            "NovelFormatter_${VERSION}_Linux_ARM64.tar.gz" \
            SHA256SUMS.txt BUILD-INFO.txt
          do
            grep -qx "$name" <<< "$ASSETS"
          done
          BODY="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          grep -Fq "$GITHUB_SHA" <<< "$BODY"
          grep -Fq "NovelFormatter_${VERSION}_Windows_x64_Setup.exe" <<< "$BODY"
          grep -Fq "NovelFormatter_${VERSION}_Linux_x86_64.AppImage" <<< "$BODY"
          grep -Fq "NovelFormatter_${VERSION}_Linux_ARM64.AppImage" <<< "$BODY"
          gh release view "$RELEASE_TAG" --json url,name,tagName,isDraft,isPrerelease,assets \
            --jq '{url,name,tagName,isDraft,isPrerelease,assets:[.assets[].name]}'
